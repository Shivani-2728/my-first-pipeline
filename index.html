<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Automated DevOps Showcase</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 500px;
      }
      h1 {
        color: #2b6cb0;
        margin-bottom: 10px;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.6;
        color: #4a5568;
      }
      .badge {
        display: inline-block;
        background-color: #48bb78;
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.9rem;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>My Live DevOps Project</h1>
      <p>
        Welcome! This website was built on Windows, formatted with Prettier,
        proofread for typos, and deployed automatically to GitHub Pages using
        CI/CD pipelines.
      </p>
      <div class="badge">Pipeline Status: Passing 🟩</div>
    </div>
  </body>
</html>
