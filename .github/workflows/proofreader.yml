name: Proofreader and Formatter

on: [push, pull_request]

permissions:
  contents: write # Allows GitHub to fix typos and save them back to your repo

jobs:
  proofread_and_format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Spell Checker and Fix Typos
        uses: crate-ci/typos@v1.29.4
        with:
          files: .
          write_changes: true # Correct parameter name for this action

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Prettier Formatter
        run: |
          npm install -g prettier
          prettier --write "**/*.{html,md}"

      - name: Push Auto-Fixes Back to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix typos and code formatting"